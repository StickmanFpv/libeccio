# Libeccio: build the FM-1 package with the community's shared builder (zvenson/fm1-build), which installs the JieLi
# toolchain and SDK, builds and attests the package. Every push to main builds one: it is the run's "packages"
# artifact (Actions > the run > Artifacts). A version tag (v0.1.0 ...) also publishes it as that tag's release.
# Flash the .fwsc with an FM-1 web installer or tools/fm1_install.py.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      build: if [[ "$GITHUB_REF" == refs/tags/v* ]]; then ./build.sh --release "${GITHUB_REF_NAME#v}"; else ./build.sh; fi
      packages: build/*.fwsc
