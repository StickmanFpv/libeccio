# Libeccio: build the FM-1 package with the community's shared builder (zvenson/fm1-build), which installs the JieLi
# toolchain and SDK, builds and attests the package. Every push to main builds one: it is the run's "packages"
# artifact (Actions > the run > Artifacts). A version tag (v0.1.0 ...) also publishes it as that tag's release.
# Flash the .fwsc with an FM-1 web installer or tools/fm1_install.py.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      # (the log's tail also becomes the run's error annotation, readable without the full log)
      build: >-
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then set -- --release "${GITHUB_REF_NAME#v}"; else set --; fi;
        ./build.sh "$@" > build.log 2>&1; rc=$?; tail -n 40 build.log;
        if [ $rc -ne 0 ]; then echo "::error title=build failed::$(tail -n 60 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"; exit $rc; fi
      packages: build/*.fwsc
